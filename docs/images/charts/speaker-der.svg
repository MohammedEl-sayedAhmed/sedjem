<text x="24" y="56" font-size="12" fill="#4b5563">The speaker time missed, falsely detected or given to the wrong person, with the number</text>
<text x="24" y="76" font-size="12" fill="#4b5563">of people estimated. Nemotron as the app gives one speaker at a time.</text>
