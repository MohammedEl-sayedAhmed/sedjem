<title>Meeting excerpts: TitaNet-small and Nemotron-3-Diarization</title>
<rect x="0.5" y="0.5" width="799" height="559" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="36" font-size="16" fill="#1f2937" font-weight="600">Meeting excerpts: TitaNet-small and Nemotron-3-Diarization</text>
<text x="24" y="56" font-size="12" fill="#4b5563">Nemotron counted the people right on every excerpt. TitaNet-small's estimate of the count</text>
<text x="24" y="76" font-size="12" fill="#4b5563">was wrong only on m6, where it found fewer people than were there.</text>
<rect x="24" y="92" width="12" height="12" rx="3" fill="#4b5563"/>
<text x="42" y="102" font-size="12" fill="#4b5563">TitaNet-small, true number of people</text>
