<text x="519.84" y="102" font-size="12" fill="#4b5563">Nemotron-3-Diarization</text>
<text x="156" y="132" font-size="13" fill="#1f2937" font-weight="600">Words given to the wrong speaker, %</text>
<text x="156" y="147" font-size="11" fill="#6b7280">lower is better</text>
