# The words of the Arabic page, https://mohammedel-sayedahmed.github.io/sedjem/ar/, with the same keys as en.toml.
#
# Egyptian Arabic, with the English terms left in English in Latin script, the way the readers talk: that is the
# product's point. Brand and model names, UI labels, file names, code and numbers stay in Latin script and Western
# digits. Write the Latin words plainly: build.py puts every run of them in its own left-to-right span, marked as
# English and not to be translated, so each keeps its order inside the right-to-left line. Values are HTML; the
# [page] table and the keys ending in _alt are plain text for attributes. {{version}} is filled in by build.py.
# The lines marked "new" weren't in the Arabic copy the page was first written from; those marked "trimmed" are
# shorter versions of lines that were.

[page]
lang = "ar"
dir = "rtl"
locale = "ar_EG"
title = "Sedjem: نصوص اجتماعاتك بالعربي المصري والإنجليزي، على جهازك انت"
description = "Sedjem بيحوّل اجتماعاتك ومكالماتك اللي بالمصري والإنجليزي لنص مكتوب على جهازك انت، والكلمات الإنجليزي بتفضل بالإنجليزي، وكل متكلم بيتعرف من صوته."
social_alt = "لوجو Sedjem، وجملة «الاجتماعات مش بتتكلم لغة واحدة.» فوق تلات سطور من اجتماع sprint planning متألّف بالعربي المصري والإنجليزي، واسم كل متكلم بلونه"  # new
skip = "روح للمحتوى"  # new
other = "English"

[nav]
download = "التحميل"
docs = "التوثيق"
github = "GitHub"
menu = "القائمة"  # new

