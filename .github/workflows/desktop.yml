# Build and check the desktop app on Windows and Linux, and publish it (docs/14-pipeline.md).
# Runs when started by hand (Actions → Desktop build → Run workflow, or `gh workflow run desktop.yml`), for a pull
# request that changes how the app is built or started, for a version tag, and when the Release workflow
# (release.yml) or the Nightly preview workflow (preview.yml) calls it with a version and a commit. Started by hand
# or for a pull request it only builds and checks. A tag or a call also publishes the Windows installer, the Linux
# build and their checksums on GitHub (.github/scripts/preview_plan.py checks the version first):
#   vX.Y.Z                       a release, normally from release.yml; X.Y.Z must match app/__init__.py. A tag
#                                pushed by hand (git tag v0.3.0 && git push origin v0.3.0) is published too, but
#                                skips the Release workflow's checks
#   vX.Y.Z-preview.YYYYMMDD[.N]  a pre-release, normally from preview.yml; X.Y.Z must be the next patch after
#                                the newest release
# A release waits for the approval of the "release" environment when it asks for one, and is then sent to winget
# once the WINGET_TOKEN secret exists (docs/10-desktop.md); a preview or a build by hand never is.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # built and checked, never published: the installer, the build and how they start
  pull_request:
    paths:
      - "desktop/**"
      - "requirements*.txt"
      - "app/__main__.py"
      - "app/desktop.py"
      - "app.sh"
      - "app.cmd"
      - ".github/workflows/**"
      - ".github/scripts/preview_plan.py"
      - ".github/scripts/release.py"
      - ".github/scripts/run_tests.py"
  workflow_call:
    inputs:
      version:
        description: "The version to build and publish: a release, such as 0.3.2, or a preview, such as 0.2.1-preview.20261021"
        type: string
        required: true
      commit:
        description: "The full sha of the commit to build"
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        description: "For the winget job; release.yml passes it, preview.yml doesn't"
        required: false

permissions:
  contents: read

# A new push to a pull request cancels the build it replaces; every other build runs to the end.
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A Sedjem started here (the self-tests, the installed build) never sends anonymous usage counts (app/usage.py)
env:
  SEDJEM_NO_USAGE: "1"

jobs:
  version:
    # What is built, from which commit, and whether it is published; a version that doesn't fit stops here.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      base: ${{ steps.version.outputs.base }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
      winget: ${{ steps.winget.outputs.winget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CALLED_WITH: ${{ inputs.version }}
        run: |
          app=$(python3 -c "import app; print(app.__version__)")
          if [ -n "$CALLED_WITH" ]; then           # a release from release.yml, or a nightly preview from preview.yml
            version=$CALLED_WITH publish=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then   # a pushed tag
            version=${GITHUB_REF_NAME#v} publish=true
          else                                      # by hand (even on a tag) or for a pull request: not published
            version=$app publish=false
          fi
          # adds channel (stable or preview) and base (the release a preview follows) to the outputs
          python3 .github/scripts/preview_plan.py check "$version" --app-version "$app" --repo "$GITHUB_REPOSITORY"
          {
            echo "version=$version"
            echo "commit=$(git rev-parse HEAD)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: winget
        # A release being published goes to winget once the WINGET_TOKEN secret exists. Only whether it exists is
        # read here, never the secret itself; a preview gets no secrets anyway.
        id: winget
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.channel == 'stable'
        env:
          WINGET: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          echo "sent to winget: $WINGET"
          echo "winget=$WINGET" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Tests (the hosted services are local stand-ins; no models needed)
        run: python .github/scripts/run_tests.py --title "Tests before the build on $RUNNER_OS"
        env:
          # the browser tests (tests/test_ui*.py) run in the runner's Chrome; fail rather than skip without it
          SEDJEM_UI_REQUIRED: "1"
          # a failed browser test leaves its Playwright trace and a screenshot here (tests/ui_support.py)
          SEDJEM_UI_TRACES: ui-failures

      - name: Upload the failed browser tests' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failures-desktop-${{ matrix.os }}
          path: ui-failures
          retention-days: 14
          if-no-files-found: ignore

      - name: Self-test from source
        run: python -m app.desktop --self-test --report selftest-source.json

      - name: Build
        # the build's stamp (app/_build.json) names this version and channel
        run: python desktop/build.py
        env:
          SEDJEM_VERSION: ${{ needs.version.outputs.version }}
          SEDJEM_CHANNEL: ${{ needs.version.outputs.channel }}

      - name: Version resource (Windows)
        # what Windows shows in the file's properties (desktop/build.py writes it)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $info = (Get-Item dist\Sedjem\Sedjem.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName, LegalCopyright, OriginalFilename
          if ("$($info.ProductName)".Trim() -ne "Sedjem" -or "$($info.ProductVersion)".Trim() -ne $env:VERSION) {
            throw "Sedjem.exe names itself $($info.ProductName) $($info.ProductVersion), not Sedjem $env:VERSION"
          }

      - name: Self-test the build (Linux)
        if: runner.os == 'Linux'
        run: dist/Sedjem/Sedjem --self-test --report selftest-build.json

      - name: Self-test the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # a windowed .exe doesn't block the shell or print: wait for it and read its report
          $report = Join-Path $PWD "selftest-build.json"
          $p = Start-Process -FilePath dist\Sedjem\Sedjem.exe -ArgumentList "--self-test","--report","`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - name: Real model test (Windows build; downloads whisper-medium, ~820 MB)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-models.json"
          $p = Start-Process -FilePath dist\Sedjem\Sedjem.exe -ArgumentList "--self-test","--models","--report","`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - name: Window test (Windows, WebView2)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-window.json"
          $p = Start-Process -FilePath dist\Sedjem\Sedjem.exe -ArgumentList "--self-test","--window","--report","`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - name: Installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          SEDJEM_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc desktop\installer.iss

      - name: Installer version resource (Windows)
        # the same product and version as Sedjem.exe's. Inno Setup pads its version strings with spaces, so they
        # are compared trimmed (as Sedjem.exe's are, for the same check in both places)
        if: runner.os == 'Windows' && hashFiles('dist/Sedjem-*-setup.exe') != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $info = (Get-Item "dist\Sedjem-${env:VERSION}-setup.exe").VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName, LegalCopyright
          if ("$($info.ProductName)".Trim() -ne "Sedjem" -or "$($info.ProductVersion)".Trim() -ne $env:VERSION) {
            throw "the installer names itself $($info.ProductName) $($info.ProductVersion), not Sedjem $env:VERSION"
          }

      - name: Upload the Windows installer
        # before the update test, so that an installer whose test fails can still be tried by hand
        if: runner.os == 'Windows' && hashFiles('dist/Sedjem-*-setup.exe') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sedjem-windows-setup
          path: dist/Sedjem-*-setup.exe
          retention-days: 7

      - name: Installer update mode (Windows)
        # The installer into a temporary folder, then again over itself the way Sedjem's own updates run it. The
        # update must replace the program (leaving none of the old files), keep the data folder, start the new
        # Sedjem from the installed folder, and leave an uninstaller that works. Silent, setup shows no Privacy page
        # and leaves the usage counts' setting alone, unless /USAGECOUNTS=0 turns them off, which the next start of
        # Sedjem takes from beside Sedjem.exe, once.
        if: runner.os == 'Windows' && hashFiles('dist/Sedjem-*-setup.exe') != ''
        timeout-minutes: 15
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $setup = (Resolve-Path "dist\Sedjem-${env:VERSION}-setup.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP "Sedjem install"
          $exe = Join-Path $dir "Sedjem.exe"
          $data = Join-Path $env:LOCALAPPDATA "Sedjem"
          $portFile = Join-Path $data "app_data\port"
          $settings = Join-Path $data "app_data\settings.json"
          $choice = Join-Path $dir "installer.json"  # the Privacy page's choice, beside Sedjem.exe for its next start
          $entry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F3C2E9A-4B71-4D5C-9A2E-8B1F0C7D3E45}_is1"
          function Invoke-Setup([string]$file, [string[]]$arguments) {
            # not Start-Process -Wait, which would also wait for the Sedjem that setup starts
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # keeps the exit code readable once it has exited
            if (-not $p.WaitForExit(300000)) {
              Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.Name) | $($_.MainWindowTitle)" } | Out-Host
              throw "$file $arguments was still running after 5 minutes"
            }
            if ($p.ExitCode -ne 0) { throw "$file $arguments exited with $($p.ExitCode)" }
          }
          function Get-Installed { Get-Process -Name Sedjem -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } }
          function Wait-Sedjem([string]$failure) {
            # the address of the Sedjem that answers at the port it noted
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt 120) {  # two minutes in all, however slow each try is
              try {  # the port file may not be there yet, or be half written
                $port = "$(Get-Content -Raw -ErrorAction Stop $portFile)".Trim()
                $status = Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 3
                if ($status.app -eq "sedjem") { "Sedjem $($status.version) answered at port $port" | Out-Host; return "http://127.0.0.1:$port" }
              } catch { }
              Start-Sleep -Seconds 1
            }
            $log = Join-Path $data "app_data\sedjem.log"
            if (Test-Path $log) { Get-Content $log -Tail 40 | Out-Host }
            Get-Process -Name Sedjem -ErrorAction SilentlyContinue | ForEach-Object { "still running: $($_.Path) ($($_.Id))" } | Out-Host
            throw "${failure}: nothing answered at the port in $portFile within two minutes"
          }
          function Stop-Sedjem([string]$url) {
            $running = @(Get-Installed)
            Invoke-RestMethod -Method Post "$url/api/quit" -Headers @{ "X-Sedjem" = "1" } | Out-Null
            foreach ($p in $running) {
              if (-not $p.WaitForExit(30000)) {
                "::warning::Sedjem was still running 30 s after /api/quit; stopping it" | Out-Host
                Stop-Process -Id $p.Id -Force
              }
            }
          }
          function Assert-Untouched([string]$when) {
            if (Test-Path $choice) { throw "$when left $choice" }
            if ((Get-Content -Raw $settings) -ne $kept) { throw "$when changed settings.json: $(Get-Content -Raw $settings)" }
          }

          # the data folder, which neither the update nor the uninstaller may touch
          New-Item -ItemType Directory -Force -Path (Join-Path $data "app_data") | Out-Null
          Set-Content -Path (Join-Path $data "keep.txt") -Value "kept"
          $kept = '{"update_check": false}'
          Set-Content -Path $settings -Value $kept -NoNewline
          Remove-Item -Force -ErrorAction SilentlyContinue $portFile, $choice

          "1. A silent installation into $dir"
          Invoke-Setup $setup @("/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"")
          if (-not (Test-Path $exe)) { throw "no Sedjem.exe after the installation" }
          Start-Sleep -Seconds 3
          if (@(Get-Installed).Count -gt 0) { throw "a silent installation without /UPDATE=1 started Sedjem" }
          Assert-Untouched "a silent installation"
          Set-Content -Path (Join-Path $dir "_internal\left-by-the-old-version.txt") -Value "old"

          "2. The update, as Sedjem runs it (no /DIR: setup finds the installation itself)"
          Invoke-Setup $setup @("/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/UPDATE=1")
          if (Test-Path (Join-Path $dir "_internal\left-by-the-old-version.txt")) { throw "the old version's files were left" }
          $stamp = Get-Content -Raw (Join-Path $dir "_internal\app\_build.json") | ConvertFrom-Json
          if ($stamp.version -ne $env:VERSION) { throw "the installed build says $($stamp.version), not $env:VERSION" }
          if ((Get-ItemProperty -Path $entry).DisplayVersion -ne $env:VERSION) { throw "the uninstall entry doesn't say $env:VERSION" }
          if ((Get-Content -Raw (Join-Path $data "keep.txt")).Trim() -ne "kept") { throw "the data folder was changed" }

          "3. The new Sedjem started from $dir"
          $url = Wait-Sedjem "Sedjem didn't start after the update"
          $running = @(Get-Installed)
          if ($running.Count -eq 0) { throw "what answers at $url is not $exe" }
          "process $($running.Id -join ', ') is $exe"
          Stop-Sedjem $url
          Assert-Untouched "the update, or the Sedjem it started,"

          "4. A silent installation with /USAGECOUNTS=0, and the next start of Sedjem"
          Invoke-Setup $setup @("/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/USAGECOUNTS=0")
          $left = Get-Content -Raw -ErrorAction Stop $choice | ConvertFrom-Json
          if ($left.usage_counts -ne $false -or $left.changed -ne $true) { throw "/USAGECOUNTS=0 left $(Get-Content -Raw $choice)" }
          Remove-Item -Force -ErrorAction SilentlyContinue $portFile
          Start-Process -FilePath $exe -ArgumentList "--server" | Out-Null
          $url = Wait-Sedjem "Sedjem didn't start after the installation with /USAGECOUNTS=0"
          if (Test-Path $choice) { throw "Sedjem kept $choice after applying it" }
          $now = Get-Content -Raw $settings | ConvertFrom-Json
          if ($now.usage_counts -ne $false -or $now.update_check -ne $false) { throw "settings.json is $(Get-Content -Raw $settings)" }
          Stop-Sedjem $url

          "5. The uninstaller"
          Invoke-Setup (Join-Path $dir "unins000.exe") @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          foreach ($i in 1..60) { if (-not (Test-Path $exe) -and -not (Test-Path $entry)) { break }; Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "the uninstaller left Sedjem.exe" }
          if (Test-Path $entry) { throw "the uninstaller left the entry in Installed apps" }
          if (-not (Test-Path (Join-Path $data "keep.txt"))) { throw "the uninstaller removed the data folder" }
          "The update installed $env:VERSION over itself, kept the data and started Sedjem; silent installations left the usage counts' setting alone and /USAGECOUNTS=0 turned it off; the uninstaller works"

      - name: Update over the newest release (Windows)
        # The newest release, installed and running, updated by this build's installer the way Update now does it
        # (app/updates.py): setup starts in its update mode and Sedjem quits. The new version must replace the old
        # one, keep the data folder and start from the installed folder, and the uninstaller must still remove it.
        if: runner.os == 'Windows' && hashFiles('dist/Sedjem-*-setup.exe') != ''
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          $setup = (Resolve-Path "dist\Sedjem-${env:VERSION}-setup.exe").Path
          $previous = Join-Path $env:RUNNER_TEMP "newest release"
          $dir = Join-Path $env:RUNNER_TEMP "Sedjem over the release"
          $exe = Join-Path $dir "Sedjem.exe"
          $data = Join-Path $env:LOCALAPPDATA "Sedjem"
          $portFile = Join-Path $data "app_data\port"
          $entry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F3C2E9A-4B71-4D5C-9A2E-8B1F0C7D3E45}_is1"
          function Invoke-Setup([string]$file, [string[]]$arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # keeps the exit code readable once it has exited
            if (-not $p.WaitForExit(300000)) { throw "$file $arguments was still running after 5 minutes" }
            if ($p.ExitCode -ne 0) { throw "$file $arguments exited with $($p.ExitCode)" }
          }
          function Wait-Sedjem([string]$failure) {
            # the status of the Sedjem that answers at the port it noted, with its address
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt 120) {
              try {
                $port = "$(Get-Content -Raw -ErrorAction Stop $portFile)".Trim()
                $status = Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 3
                if ($status.app -eq "sedjem") {
                  "Sedjem $($status.version) answered at port $port" | Out-Host
                  return @{ url = "http://127.0.0.1:$port"; version = "$($status.version)" }
                }
              } catch { }
              Start-Sleep -Seconds 1
            }
            $log = Join-Path $data "app_data\sedjem.log"
            if (Test-Path $log) { Get-Content $log -Tail 40 | Out-Host }
            throw "${failure}: nothing answered at the port in $portFile within two minutes"
          }

          "1. The newest release's installer"
          foreach ($i in 1..3) {
            gh release download --repo $env:GITHUB_REPOSITORY --pattern "*-setup.exe" --dir $previous --clobber
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          $old = @(Get-ChildItem -Path $previous -Filter "*-setup.exe")
          if ($old.Count -ne 1) { throw "the newest release has $($old.Count) files named *-setup.exe" }
          $oldVersion = $old[0].Name -replace '^Sedjem-(.+)-setup\.exe$', '$1'

          "2. Sedjem $oldVersion installed into $dir, and started"
          Invoke-Setup $old[0].FullName @("/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"")
          New-Item -ItemType Directory -Force -Path (Join-Path $data "app_data") | Out-Null
          Set-Content -Path (Join-Path $data "kept-over-the-update.txt") -Value "kept"
          Remove-Item -Force -ErrorAction SilentlyContinue $portFile
          Start-Process -FilePath $exe -ArgumentList "--server" | Out-Null
          $running = Wait-Sedjem "Sedjem $oldVersion didn't start"
          if ($running.version -ne $oldVersion) { throw "the newest release answered as $($running.version), not $oldVersion" }

          "3. This build's installer in its update mode, then Sedjem quits, as Update now does"
          $p = Start-Process -FilePath $setup -ArgumentList @("/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/UPDATE=1") -PassThru
          $null = $p.Handle
          Invoke-RestMethod -Method Post "$($running.url)/api/quit" -Headers @{ "X-Sedjem" = "1" } | Out-Null
          if (-not $p.WaitForExit(300000)) { throw "the update was still running after 5 minutes" }
          if ($p.ExitCode -ne 0) { throw "the update exited with $($p.ExitCode)" }

          "4. The new Sedjem, started by setup from $dir"
          $running = Wait-Sedjem "Sedjem didn't start after the update from $oldVersion"
          if ($running.version -ne $env:VERSION) { throw "after the update Sedjem $($running.version) answered, not $env:VERSION" }
          $stamp = Get-Content -Raw (Join-Path $dir "_internal\app\_build.json") | ConvertFrom-Json
          if ($stamp.commit -ne $env:COMMIT) { throw "the installed build is from $($stamp.commit), not $env:COMMIT" }
          $processes = @(Get-Process -Name Sedjem -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
          if ($processes.Count -eq 0) { throw "what answers at $($running.url) is not $exe" }
          if ((Get-Content -Raw (Join-Path $data "kept-over-the-update.txt")).Trim() -ne "kept") { throw "the data folder was changed" }
          Invoke-RestMethod -Method Post "$($running.url)/api/quit" -Headers @{ "X-Sedjem" = "1" } | Out-Null
          foreach ($p in $processes) { if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force } }

          "5. The uninstaller"
          Invoke-Setup (Join-Path $dir "unins000.exe") @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          foreach ($i in 1..60) { if (-not (Test-Path $exe) -and -not (Test-Path $entry)) { break }; Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "the uninstaller left Sedjem.exe" }
          if (Test-Path $entry) { throw "the uninstaller left the entry in Installed apps" }
          "Sedjem $oldVersion, installed and running, was updated to $env:VERSION as Update now does it, kept the data and started again"

      - name: Self-test reports
        if: always()
        run: cat selftest-*.json || true

      - name: Upload the Windows build folder (when there is no installer)
        if: runner.os == 'Windows' && hashFiles('dist/Sedjem-*-setup.exe') == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sedjem-windows
          path: dist/Sedjem
          retention-days: 7

      - name: Linux archive (published builds)
        if: runner.os == 'Linux' && needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tar -czf "dist/Sedjem-$VERSION-linux-x64.tar.gz" -C dist Sedjem

      - name: Upload the Linux archive
        if: runner.os == 'Linux' && needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sedjem-linux
          path: dist/Sedjem-*-linux-x64.tar.gz
          retention-days: 7

  release:
    # A release tag publishes a release, after the approval of the "release" environment when it asks for one
    # (docs/14-pipeline.md); a preview, a pre-release of its commit, with notes saying what it is.
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.version.outputs.channel == 'stable' && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0  # the tags and the commits since the previous release, for notes drafted from them
          persist-credentials: false

      # by name: a version without the Windows installer or the Linux archive must not be published
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sedjem-windows-setup
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sedjem-linux
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          COMMIT: ${{ needs.version.outputs.commit }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          tag="v$VERSION"
          cd release
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          if [ "$CHANNEL" = preview ]; then
            python3 ../.github/scripts/preview_plan.py notes "$VERSION" --commit "$COMMIT" --base "$BASE" \
              --repo "$GITHUB_REPOSITORY" > ../preview-notes.md
            gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --title "Sedjem $VERSION" \
              --prerelease --target "$COMMIT" --notes-file ../preview-notes.md
          else
            # every release page links the privacy policy
            privacy="[Privacy policy](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/privacy.md)"
            # the notes written for this release, else a draft from the titles of the commits since the last one
            python3 ../.github/scripts/release.py notes "$VERSION" --commit "$COMMIT"
            notes="../.github/release-notes/$tag.md"
            { cat "$notes"; printf '\n---\n\n%s\n' "$privacy"; } > ../release-notes.md
            # the tag must be there already (release.yml makes it, or it was pushed), never made here from main
            gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --title "Sedjem $VERSION" --verify-tag \
              --notes-file ../release-notes.md
          fi

  winget:
    # A release, once published, goes to winget as a pull request to microsoft/winget-pkgs (winget install
    # MohammedElsayedAhmed.Sedjem). wingetcreate starts from the newest version winget has, so the first version was
    # sent by hand, from packaging/winget/; the WINGET_TOKEN secret, a classic token with the public_repo scope, is
    # added once winget has accepted it. Skipped for previews, builds by hand, and while the secret is missing.
    if: needs.version.outputs.winget == 'true'
    needs: [version, release]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Send the release to winget
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          # wingetcreate reads its token from here, so it never appears on a command line
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # the release's installer: its one file whose name ends in -setup.exe
          $assets = (gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          $setup = @($assets | Where-Object { $_.name -match '-setup\.exe$' })
          if ($setup.Count -ne 1) { throw "v$env:VERSION has $($setup.Count) files named *-setup.exe" }
          # wingetcreate, a fixed version, checked against its SHA-256
          $wingetcreate = Join-Path $env:RUNNER_TEMP "wingetcreate.exe"
          Invoke-WebRequest "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" -OutFile $wingetcreate
          if ((Get-FileHash $wingetcreate -Algorithm SHA256).Hash -ne "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA") {
            throw "wingetcreate.exe isn't the file expected"
          }
          # x64 and the current user, as in the manifests: Inno Setup's own program is 32-bit, which wingetcreate
          # would otherwise take for the app's architecture
          & $wingetcreate update MohammedElsayedAhmed.Sedjem --version $env:VERSION --urls "$($setup[0].url)|x64|user" `
            --release-notes-url "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION" --submit --no-open
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited with $LASTEXITCODE" }
