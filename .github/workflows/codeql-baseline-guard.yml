# Puts back the CodeQL baseline when anyone but the CodeQL workflow changes it (docs/14-pipeline.md). The
# `security-baseline` branch holds the findings that the ratchet in codeql.yml lets through, so a push there
# would hide new findings. The CodeQL workflow writes the branch with the job's own token, and a push made with
# that token starts no workflow: every run of this one is somebody else's push. It
#
# - adds a commit that restores the files as they were before the push (a branch that someone else created is
#   deleted), so the history keeps the push and its undoing;
# - opens an issue, or adds to the open one, with who pushed and what was done.
#
# It uses the API only, with no checkout, as stats.yml does. Its limits: GitHub reads a push's workflows from the
# pushed commit, so the branch carries main's files (the CodeQL workflow builds each baseline commit on main's
# tree), and a push that removes this file from the branch is not guarded. GitHub starts no push workflow for a
# branch deletion either: a deleted baseline is written again by the next push to main, the weekly run or a run by
# hand on main, and until then the ratchet fails every pull request once CODEQL_RATCHET_ARMED is true. A ruleset
# that lets only GitHub Actions write the branch is not possible in a repository a person owns (GitHub accepts that
# bypass actor only for an organisation's repository), so this workflow and the armed check are the controls.
name: CodeQL baseline guard

on:
  push:
    branches: [security-baseline]

permissions: {}

# one push at a time, each undone in turn
concurrency:
  group: codeql-baseline-guard
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # the baseline branch, through the API
      issues: write
    steps:
      - name: Put the baseline back
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          api="repos/$GITHUB_REPOSITORY/git"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            gh api -X DELETE "$api/refs/heads/security-baseline"
            echo "The branch did not exist before this push, so it was deleted." | tee -a "$RUNNER_TEMP/what-was-done.txt"
          else
            tree=$(gh api "$api/commits/$BEFORE" --jq .tree.sha)
            new=$(gh api -X POST "$api/commits" -f message="Put back the baseline of ${BEFORE:0:7}" -f tree="$tree" \
              -f "parents[]=$AFTER" --jq .sha)
            gh api -X PATCH "$api/refs/heads/security-baseline" -f sha="$new" > /dev/null
            echo "The files were put back as they were at ${BEFORE:0:7}, in the commit ${new:0:7}." | tee -a "$RUNNER_TEMP/what-was-done.txt"
          fi

      - name: Open or update the issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          AFTER: ${{ github.event.after }}
          OUTCOME: ${{ steps.restore.outcome }}
        run: |
          title="The CodeQL baseline was changed by a push"
          if [ "$OUTCOME" = "success" ]; then
            result=$(cat "$RUNNER_TEMP/what-was-done.txt")
          else
            result="Putting it back failed. Look at the run, and put the branch back by hand."
          fi
          {
            echo "$ACTOR pushed to the security-baseline branch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$AFTER"
            echo
            echo "$result"
            echo
            echo "Only the CodeQL workflow writes this branch (.github/workflows/codeql.yml). It holds the findings that"
            echo "a pull request is allowed to have, so a change by hand would hide new findings from the ratchet."
            echo "Check whether the push was a slip or meant, and whether a merge since then hides a finding."
            echo "A finding that is known and meant to stay needs no change here: the next push to main writes it."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
