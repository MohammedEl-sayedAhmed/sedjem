# The dependencies' known vulnerabilities (docs/14-pipeline.md): pip-audit on the requirement files, for every
# push to main and pull request and once a week, since a vulnerability can be published for a version already in
# use; and for a pull request, GitHub's dependency review of what it adds or changes, the workflows' actions
# included. Dependabot (.github/dependabot.yml) proposes the updates.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels the run it replaces; every commit on main gets its own.
concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # pip-audit resolves the three files together, as the Tests workflow installs them, and looks every package
      # up in the Python Packaging Advisory Database and OSV. Its version is pinned here, outside Dependabot's view.
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --progress-spinner off --desc on \
            -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # fails on a dependency the pull request adds with a known vulnerability of high severity or more
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
