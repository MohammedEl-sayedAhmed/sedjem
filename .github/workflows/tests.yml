# The test suite on Linux and Windows, for every push to main and every pull request. The Desktop build
# workflow runs the same tests before building, but only by hand or for a version tag; this catches
# problems when they are made, not on release day.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Tests (the hosted services are local stand-ins; no models needed)
        run: python -m unittest discover -s tests -v
        env:
          # the browser tests (tests/test_ui*.py) run in the runner's Chrome; fail rather than skip without it
          SEDJEM_UI_REQUIRED: "1"

  # Windows from source, as README.md and docs/10-desktop.md say, in PowerShell (the terminal of VS Code and
  # Windows Terminal): a .venv made with `py -3.12` and the two requirement files, then .\app.cmd, which must
  # start Sedjem (here its server only, as there is no desktop); and the same with uv, whose self-test must pass.
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 30
    # Sedjem itself runs here, outside the test runner, so it is told not to send anonymous usage counts
    # (app/usage.py). The test job above runs without this, as on a developer's computer: the tests never send.
    env:
      SEDJEM_NO_USAGE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up as the docs say
        shell: pwsh
        run: |
          py -3.12 -m venv .venv || python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt -r requirements-desktop.txt

      - name: .\app.cmd starts Sedjem
        shell: pwsh
        run: |
          .\app.cmd --server --port 8799
          $status = $null
          foreach ($i in 1..90) {
            try { $status = Invoke-RestMethod http://127.0.0.1:8799/api/status; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $status -or $status.app -ne "sedjem") { throw "app.cmd did not start Sedjem" }
          "Sedjem $($status.version) answered, reading $($status.home)"
          Invoke-RestMethod -Method Post http://127.0.0.1:8799/api/quit -Headers @{ "X-Sedjem" = "1" } | Out-Null

      - name: Self-test from the venv
        shell: cmd
        run: .venv\Scripts\python -m app.desktop --self-test --report selftest-venv.json

      - name: Set up with uv as the docs say, and its self-test
        shell: pwsh
        run: |
          python -m pip install uv==0.13.0
          uv venv .venv-uv --python 3.12
          uv pip install --python .venv-uv -r requirements.txt -r requirements-desktop.txt
          .venv-uv\Scripts\python -m app.desktop --self-test --report selftest-uv.json

      - name: Self-test reports
        if: always()
        shell: bash
        run: cat selftest-venv.json selftest-uv.json || true
