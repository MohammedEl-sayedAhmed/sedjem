# Recommended models for Egyptian Arabic–English meetings and calls, listed in Settings → Add models →
# Recommended.
#
# builtin = the id of a model in app/config.toml. The other entries are added with the Hugging Face importer
# (app/hub.py) from the pinned revision, so they download the same checked files for everyone: kind and
# architecture are what the importer finds there, and the sizes are of the download. gpu is "any" (through
# Vulkan: Intel, AMD and NVIDIA graphics) or "nvidia" (CUDA only). Measured figures come from
# docs/03-results.md (the 40 Egyptian clips of the Perle benchmark); everything else says it is untested.
# Checked with the importer on 25 September 2026.

[[models]]
builtin = "cohere"
name = "Cohere Transcribe Arabic"
good_for = "Arabic-heavy meetings: the fewest errors on Arabic words, and the fastest in the project's tests."
evidence = "In the project's tests on the Perle clips: 13.4% WER, 77% of English terms kept in English, and 0.36× real time on the test laptop's processor (Core i5-1245U) or 0.15× on its Intel Iris Xe graphics."
gpu = "any"
licence = "Apache-2.0"

[[models]]
builtin = "whisper-medium"
name = "whisper-medium code-switching"
good_for = "Meetings full of English terms: it keeps the most of them in English."
evidence = "In the project's tests on the Perle clips: 18.5% WER and 90% of English terms kept in English."
gpu = "nvidia"
licence = "MIT"

[[models]]
builtin = "large-v3"
name = "Whisper large-v3 with the style hint"
good_for = "Stock Whisper, kept in Egyptian dialect by a one-sentence hint. Slow on a laptop processor."
evidence = "In the project's tests on the Perle clips: 20.8% WER and 88% of English terms kept with the hint, 39.7% WER without it."
gpu = "nvidia"
licence = "MIT"

