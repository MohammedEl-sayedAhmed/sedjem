<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sedjem</title>
  <meta name="description" content="Transcribe recordings with speaker labels, locally or with ElevenLabs / Speechmatics">
  <meta name="theme-color" content="#0e7c7b">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/compare.css">
  <link rel="stylesheet" href="/static/youtube.css">
  <link rel="stylesheet" href="/static/assistants.css">
  <link rel="stylesheet" href="/static/remote.css">
  <link rel="stylesheet" href="/static/updates.css">
  <script>
    try { const t = localStorage.getItem("sedjem-theme"); if (t) document.documentElement.dataset.theme = t;
      else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menuToggle" title="Transcriptions" aria-label="Show transcriptions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/new" aria-label="Sedjem">
      <img class="brand-light" src="/static/logo-colour.svg" alt="Sedjem">
      <img class="brand-dark" src="/static/logo-colour-dark.svg" alt="Sedjem">
    </a>
    <div class="topbar-status" id="topStatus"></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <a class="btn btn-primary btn-block" href="#/new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New transcription
    </a>
    <input class="search" type="search" id="jobSearch" placeholder="Search transcriptions" aria-label="Search transcriptions">
    <nav class="job-list" id="jobList" aria-label="Transcriptions"></nav>
    <div class="sidebar-foot" id="storageInfo"></div>
  </aside>

  <main class="main" id="main"><div class="main-inner" id="view"></div></main>
</div>

<div class="player" id="player" hidden>
  <button class="play" id="playBtn" aria-label="Play">
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
  </button>
  <button class="icon-btn skip" id="backBtn" title="Back 5 s (←)" aria-label="Back 5 seconds">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
  <button class="icon-btn skip" id="fwdBtn" title="Forward 5 s (→)" aria-label="Forward 5 seconds">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
  <span class="time" id="curTime">0:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
  <span class="time" id="durTime">0:00</span>
  <select id="rate" aria-label="Playback speed">
    <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option><option value="2">2×</option>
  </select>
  <span class="now" id="nowTitle"></span>
  <audio id="audio" preload="metadata"></audio>
</div>

<!-- The job page's video, when the recording has one: moved into the page by app.js and played by the bar above -->
<div class="video-panel" id="videoPanel" hidden>
  <div class="video-frame">
    <video id="video" preload="metadata" playsinline aria-label="The recording's video"></video>
    <svg class="video-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
  </div>
  <div class="video-tools">
    <button type="button" class="icon-btn" id="videoPip" title="Picture in picture" aria-label="Show the video in its own window"></button>
    <button type="button" class="icon-btn" id="videoSize" aria-pressed="false"></button>
    <button type="button" class="icon-btn" id="videoFull" title="Full screen (or double-click the video)" aria-label="Full screen"></button>
  </div>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="dlg-head">
    <h2 id="settingsTitle">Settings</h2>
    <button class="icon-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body" id="settingsBody"></div>
  <div class="dlg-foot">
    <button class="btn btn-danger" id="quitBtn">Quit Sedjem</button>
    <span style="flex:1"></span>
    <button class="btn" data-close>Close</button>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite" popover="manual"></div>
<script src="/static/brands.js"></script>
<script src="/static/compare.js"></script>
<script src="/static/youtube.js"></script>
<script src="/static/assistants.js"></script>
<script src="/static/remote.js"></script>
<script src="/static/updates.js"></script>
<script src="/static/usage.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
