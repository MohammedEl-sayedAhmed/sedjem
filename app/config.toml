privacy = "Groq keeps no copy by default, but may log requests for up to 30 days to look into errors or abuse."
prompt_hint = "Added after the Egyptian style hint that Whisper gets. Whisper prompts are short, so terms past about 200 characters are left out."
speakers_hint = "Groq gives no speaker labels, so they come from the speaker model on this computer, as for the local models (chosen in Settings, under Models). Each line goes to the person heard most during it."

