[[models]]
id = "elevenlabs"
kind = "hosted"
engine = "elevenlabs"
title = "ElevenLabs Scribe"
tagline = "Best published result for Egyptian–English"
facts = ["13.1% WER on Perle's Egyptian subset (published)", "Speaker labels built in",
         "4.5 h a month free, then $0.22/h", "Trains on your audio unless you opt out"]
service = "ElevenLabs"
base_url = "https://api.elevenlabs.io"
key_env = "ELEVENLABS_API_KEY"
key_url = "https://elevenlabs.io/app/settings/api-keys"
api_model = "scribe_v2"
tag_audio_events = false    # true adds (laughter), (applause), ... to the text
delete_after = true         # delete the transcript from your ElevenLabs history once fetched
prompt = true               # sent as key terms (ElevenLabs charges about 20% more for those requests)
rtf = 0.05

# Gemini, Deepgram, AssemblyAI and Azure run through app/hosted_more.py. privacy, prompt_hint and
# speakers_hint are the texts the app shows for the model.
[[models]]
id = "gemini"
kind = "hosted"
engine = "gemini"
title = "Google Gemini"
tagline = "Google's speech-to-text model"
facts = ["Egyptian Arabic (ar-EG) with code-switching", "Speaker labels for up to 8 people",
         "Free tier, then about $0.30/h", "Free tier uses your audio for training and human review"]
service = "Google"
base_url = "https://generativelanguage.googleapis.com"
key_env = "GEMINI_API_KEY"
key_url = "https://aistudio.google.com/apikey"
api_model = "gemini-3.5-transcribe"  # a general model such as "gemini-3.8-flash" gets instructions and a JSON schema instead
language_codes = []         # for Arabic + English: none, so it detects the language, which follows code-switching; English sends en-US
max_minutes = 29            # per request: 30 min is the limit with word times, so longer recordings go in parts
inline_limit_mb = 20        # a larger request uploads the part with the Files API instead
delete_after = true         # delete uploaded files from the Files API once transcribed
prompt = false              # the transcribe model can't combine key terms with word times; true adds them to a general model's instructions
privacy = "On the free tier Google uses it to improve its products and human reviewers may read it; with billing turned on it doesn't (and never for users in the EEA, Switzerland or the UK). The app asks Google not to store the request and deletes uploaded files afterwards."
prompt_hint = "Added to the instructions of a general Gemini model."
speakers_hint = "Gemini finds the speakers itself, up to 8 (3 or more is experimental); any choice other than No labels turns labels on."
rtf = 0.1

[[models]]
id = "deepgram"
kind = "hosted"
engine = "deepgram"
title = "Deepgram Nova-3"
tagline = "Fast; one language per recording"
facts = ["Egyptian Arabic (ar-EG) among 17 Arabic codes", "No Arabic–English code-switching",
         "$200 free credit, then $0.26/h", "Not used for training: the app opts out"]
service = "Deepgram"
base_url = "https://api.deepgram.com"
key_env = "DEEPGRAM_API_KEY"
key_url = "https://console.deepgram.com/"
api_model = "nova-3"
language = "ar-EG"          # for Arabic + English and auto-detect (Deepgram can't detect Arabic); or "ar", "ar-SA", ...
diarize_model = "latest"    # speaker labels (the older diarize=true is deprecated)
mip_opt_out = true          # keep the audio out of Deepgram's model training (sent with every request)
prompt = true               # sent as key terms ($0.0013/min extra)
privacy = "The app tells Deepgram not to use it for model training (mip_opt_out), so Deepgram keeps it only while it processes the request. Deepgram doesn't store transcripts."
prompt_hint = "Sent as key terms (up to 100). Deepgram charges $0.0013 a minute more for requests with key terms."
speakers_hint = "Deepgram works out the number of speakers itself; any choice other than No labels turns labels on."
rtf = 0.02

