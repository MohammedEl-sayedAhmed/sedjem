# Sedjem — settings for the transcription app.
#
# Run from source: ./app.sh (browser tab) or .venv/bin/python -m app.desktop (desktop window).
# Paths below are relative to the data folder: the project folder when run from source, a per-user
# folder in the desktop build (%LOCALAPPDATA%\Sedjem on Windows, ~/.local/share/sedjem on Linux).
# Personal overrides go in <data folder>/app_data/config.toml (same layout): a [[models]] entry there
# with the same id replaces only the fields it lists. API keys are entered in the app (Settings),
# which saves them to app_data/secrets.json, or come from the environment variables in key_env.

[server]
host = "127.0.0.1"          # local only: the app has no login, so don't expose it on a network
port = 8765
open_browser = true         # ./app.sh opens a browser tab (the desktop app opens its own window)

[storage]
dir = "app_data"            # one folder per transcription: 16 kHz audio, transcript, log (git-ignored)
keep_original = false       # also keep the uploaded file (a video can be 100x the size of the audio)
max_upload_gb = 4
courses = "courses"         # transcripts of YouTube videos and playlists as Markdown and SRT files (git-ignored)

[defaults]
model = "whisper-medium"
speakers = "auto"           # "none", "auto" (estimate the number) or a number
language = "ar"             # "ar", "en" or "auto"

[updates]
# Settings → Updates (app/updates.py, docs/12-updates.md): the repository whose releases and tested commits
# are offered, and GitHub's API, asked without a login. Whether Sedjem checks by itself is asked on first start.
repo = "MohammedEl-sayedAhmed/sedjem"
api = "https://api.github.com"

[local]
# python = ""               # interpreter for local runs; default: the one running the app
threads = 10                # CPU threads for the local models
# The speaker model that tells the speakers apart: an id from [[local.speaker_models]] below, also chosen in
# Settings → Models. While the chosen one isn't downloaded TitaNet-small is used, and without it there are no labels.
speaker_model = "titanet-small"
# Switch the computer to the performance power profile while local jobs run, and back afterwards
# (Linux, powerprofilesctl). Power-saver makes local models about 3-5x slower. Also a switch in Settings.
performance_while_running = false
# "auto": use a graphics card when one works (Cohere through Vulkan on any GPU; Whisper on NVIDIA GPUs
# once the NVIDIA libraries below are downloaded), else the CPU. "cpu": never. Also a switch in Settings.
device = "auto"

# Files the app downloads (Settings → Models), pinned to a revision and checked by size and SHA-256.

# Speaker models, for speaker labels (speakers.py). path is what the speaker step gets (--voiceprint-model): a file,
# or a folder of files. note is the line Settings shows under the title, with the download size after it; maker
# picks the logo; max_speakers, for a model that tells apart only so many people, lowers a larger number given for a
# recording. TitaNet-small's download is called "voiceprints". How they compare: docs/04-speaker-labels.md.
[[local.speaker_models]]
id = "titanet-small"
title = "TitaNet-small"
maker = "NVIDIA"
note = "Voiceprints grouped into speakers; the default"
path = "models/diarization/nemo_en_titanet_small.onnx"

