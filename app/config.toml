base_url = "https://api.assemblyai.com"  # EU: https://api.eu.assemblyai.com (audio stays in the EU and isn't used for training)
key_env = "ASSEMBLYAI_API_KEY"
key_url = "https://www.assemblyai.com/dashboard/home"
speech_models = ["universal-3-5-pro", "universal-2"]  # Universal-2 takes languages Universal-3.5 Pro doesn't
expected_languages = ["ar", "en"]  # language detection hints for Arabic + English
delete_after = true         # delete the transcript and the uploaded audio from AssemblyAI once fetched
prompt = true               # sent as key terms ($0.05/h extra)
privacy = "AssemblyAI may use it to train its models. Free accounts can't opt out; paid accounts can, under Data controls in the dashboard. The app deletes the transcript and the uploaded audio there once it has the transcript."
prompt_hint = "Sent as key terms (up to 6 words each). AssemblyAI charges $0.05/h more for them."
speakers_hint = "AssemblyAI takes the number as the exact count of speakers; use Auto-detect if you aren't sure."
rtf = 0.1

[[models]]
id = "azure"
kind = "hosted"
engine = "azure"
title = "Azure AI Speech"
tagline = "Egyptian Arabic locale, stores nothing"
facts = ["Egyptian Arabic locale (ar-EG)", "No code-switching: one language per recording",
         "$0.36/h, no free tier for this API", "Doesn't store your audio or transcript"]
service = "Microsoft Azure"
key_env = "AZURE_SPEECH_KEY"
key_url = "https://portal.azure.com/"
region = "westeurope"       # the region of your Speech resource, set in Settings (a key works only in its region)
region_env = "AZURE_SPEECH_REGION"
# endpoint = "https://<resource>.cognitiveservices.azure.com"  # instead of the region, e.g. a custom domain
api_version = "2025-10-15"
locale = "ar-EG"            # for Arabic + English; English sends en-US, auto-detect lets it pick ar-EG or en-US
max_speakers = 10           # the most speakers auto-detect looks for (2-35)
max_minutes = 115           # per request (the REST reference says under 2 hours); longer recordings go in parts
prompt = false              # true sends the vocabulary as a phrase list (listed for ar-SA and en-US, not ar-EG)
privacy = "Microsoft doesn't keep audio or transcripts from fast transcription. The recording is processed in the region of your Speech resource."
prompt_hint = "Sent as a phrase list. Azure's language table lists phrase lists for ar-SA and en-US, not ar-EG."
speakers_hint = "Azure takes the number as the most speakers to find (2 to 35); Auto-detect looks for up to 10."
rtf = 0.05

[[models]]
id = "speechmatics"
kind = "hosted"
engine = "speechmatics"
title = "Speechmatics"
tagline = "Arabic–English bilingual model"
facts = ["Arabic–English bilingual language pack", "Speaker labels built in",
         "$100 free credit (about 250 h), then $0.40/h", "Doesn't train on your audio unless you opt in"]
service = "Speechmatics"
base_url = "https://eu1.asr.api.speechmatics.com/v2"   # EU; US: us1.asr..., Australia: au1.asr...
key_env = "SPEECHMATICS_API_KEY"
key_url = "https://portal.speechmatics.com/settings/api-keys"
language = "ar_en"          # the bilingual pack; "ar" for Arabic only
api_model = "enhanced"      # "enhanced" ($0.40/h) or "standard" ($0.24/h)
speaker_sensitivity = 0.5   # 0-1, higher finds more speakers (batch jobs can't be told how many)
delete_after = true         # delete the job (audio and transcript) from Speechmatics once fetched
prompt = true               # sent as custom vocabulary
rtf = 0.15

# OpenAI, Groq and Mistral (app/hosted_openai.py). The upload is the audio as Opus in WebM, split at
# pauses into parts that fit the service's limits (max_part_mb, max_part_s).
[[models]]
id = "openai"
kind = "hosted"
engine = "openai"
title = "OpenAI"
tagline = "Doesn't keep or train on your recordings"
facts = ["gpt-transcribe, not tested on Egyptian speech", "Speaker labels from gpt-4o-transcribe-diarize",
         "No free tier; $0.27/h, $0.36/h with labels", "Doesn't train on your audio or keep it"]
service = "OpenAI"
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
key_url = "https://platform.openai.com/api-keys"
api_model = "gpt-transcribe"  # or gpt-4o-transcribe ($0.36/h), gpt-4o-mini-transcribe ($0.18/h), whisper-1 ($0.36/h)
diarize_model = "gpt-4o-transcribe-diarize"  # used when speaker labels are on ($0.36/h); "": the speaker model here
carry_speakers = true       # later parts get clips of up to 4 voices heard before, so those keep their numbers
upload_format = "webm"      # Opus in WebM, about 14 MB an hour at 32 kbps; also "ogg", "mp3" or "flac"
upload_kbps = 32
max_part_mb = 24            # OpenAI takes files of up to 25 MB
max_part_s = 600            # parts for the diarize model and whisper-1; a Tier 1 account takes 10,000 tokens a minute
max_output_tokens = 2000    # the 4o models' limit: a part whose reply reaches it is sent again in halves
piece_s = 25                # gpt-transcribe and gpt-4o-(mini-)transcribe give no times: a request per 25 s or less
prompt = true               # keywords for gpt-transcribe, the prompt for the other models (none for diarize)
rtf = 0.1
privacy = "OpenAI does not train on it and keeps no copy of transcription requests."
prompt_hint = "Sent as keywords to gpt-transcribe, or as the prompt to other OpenAI models. Not used with speaker labels, because gpt-4o-transcribe-diarize takes no vocabulary."
speakers_hint = "Labels come from gpt-4o-transcribe-diarize, which finds the speakers itself; the number isn't sent. A recording over 10 minutes goes in parts, and each part gets short clips of up to 4 voices heard before, so those people keep their numbers."

